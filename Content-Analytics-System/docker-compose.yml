# version: "3.9"# Telling the docker compose what features set to use. Safe Defaultservices:  mysql:    image: mysql:8.0  # Pulling MySQL 8.0 from Docker Hub.    container_name: cas-mysql # Setting the container name.    restart: unless-stopped   # Restarting the container, I guess    environment:      MYSQL_DATABASE: casdb      MYSQL_USER: casuser      MYSQL_PASSWORD: caspass      MYSQL_ROOT_PASSWORD: Aromal@1234   # Creating db and user automatically on the first run.#    ports:#      - "3306:3306"   #Setting the ports {(leftside)pc local port:(rightside)docker port}    volumes:      - mysql_data:/var/lib/mysql  #persist db data even if the container is deleted    healthcheck:      test: ["CMD", "mysqladmin", "ping", "-h", 'localhost', "-prootpass"]      interval: 10s      timeout: 5s      retries: 10  mongo:    image: mongo:6    container_name: cas-mongo    restart: unless-stopped    ports:      - "27017:27017"    volumes:      - mongo_data:/data/db   # Keeps Mongo data safe across restarts.    healthcheck:      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]      interval: 10s      timeout: 5s      retries: 10   # Ensuring well, the mongo actually responds before the backend starts  backend:    build:      context: .  # Building the local spring boot app into a container using Dockerfile      dockerfile: Dockerfile # <___|    container_name: cas-backend    restart: unless-stopped    depends_on:      mysql:        condition: service_healthy      mongo:        condition: service_healthy    # But depends on condition check, Backend only starts after    environment:      # Spring profile (optional, but recommended)      SPRING_PROFILES_ACTIVE: docker      SPRING_SECURITY_ENABLED: "false"      # MySQL Connection -- Important]      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/casdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true      # Inside Docker Compose, containers talk via service names. So MySQL host is mysql, not localhost.      SPRING_DATASOURCE_USERNAME: casuser      SPRING_DATASOURCE_PASSWORD: caspass      # Mongo Connection -- Important      SPRING_DATA_MONGODB_HOST: mongo  # Also fix Mongo from localhost      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/cas_db      SPRING_DATA_MONGODB_PORT: 27017      SPRING_DATA_MONGODB_DATABASE: casdb  # Matches your MySQL      # If you use JWT secret in properties      JWT_SECRET: "change_this_to_a_long_secret"    ports:      - "8080:8080"  frontend:    build:      context: ./frontend      dockerfile: Dockerfile    container_name: cas-frontend    ports:      - "3000:3000"    depends_on:      - backend    environment:      # CRA inside Docker needs this sometimes      CHOKIDAR_USEPOLLING: "true"volumes:  mysql_data:  mongo_data:  